# Local API container against the MySQL in docker-compose.yml (127.0.0.1:3310).
# QA/VPS: use docker-compose.qa.yml instead (MySQL + API, passwords from .env).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eden-bowls-backend-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UPS_LABEL_DIR: /app/ups-labels
      INVOICE_PDF_DIR: /app/invoices
    volumes:
      - eden-bowls-avatars:/app/public/avatars
      - eden-bowls-feedback-photos:/app/public/feedback-photos
      - eden-bowls-pet-photos:/app/public/pet-photos
      - eden-bowls-ups-labels:/app/ups-labels
      - eden-bowls-invoices:/app/invoices
      - ./data:/app/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  eden-bowls-avatars:
  eden-bowls-feedback-photos:
  eden-bowls-pet-photos:
  eden-bowls-ups-labels:
  eden-bowls-invoices:
