services:
  db:
    image: mysql:8.4
    container_name: eden-bowls-mysql-qa
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-eden_bowls}
      MYSQL_USER: ${DB_USER:-eden_bowls}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - eden-bowls-mysql-qa-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eden-bowls-backend-qa
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-3000}:3000"
    volumes:
      - ./public/avatars:/app/public/avatars
      - ./public/feedback-photos:/app/public/feedback-photos
      - ./data:/app/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  eden-bowls-mysql-qa-data:
