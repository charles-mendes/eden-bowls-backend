  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep:    #29362d;
      --ivory:         #F7F2E8;
      --sand:          #D9CBAF;
      --terracotta:    #C4855A;
      --terracotta-lt: #D9A07A;
      --cream:         #FAF8F4;
      --text-dark:     #141A12;
      --ff-display: 'Tenor Sans', Georgia, serif;
      --ff-body:    'Quicksand', sans-serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--ff-body); font-weight: 400; background: var(--cream); color: var(--text-dark); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.45;
    }

    /* NAV */
    nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:24px 48px; display:flex; justify-content:space-between; align-items:center; }
    .nav-logo { display:flex; align-items:center; }
    .nav-logo svg { width:220px; height:auto; display:block; }
    .nav-badge { font-size:.7rem; font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--ivory); background:rgba(217,203,175,.12); border:1px solid rgba(217,203,175,.55); padding:6px 14px; border-radius:100px; }
    @media(max-width:600px){ nav { padding:18px 20px; } }

    /* HERO */
    #hero { min-height:100svh; background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(41,54,45,.45) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 60%,rgba(196,133,90,.12) 0%,transparent 55%),radial-gradient(ellipse 100% 100% at 50% 0%,rgba(41,54,45,.9) 0%,#151d18 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px 24px 80px; position:relative; overflow:hidden; }
    .leaf { position:absolute; pointer-events:none; opacity:.12; }
    .leaf-1 { top:8%; left:-3%; width:320px; transform:rotate(-25deg); }
    .leaf-2 { bottom:5%; right:-4%; width:280px; transform:rotate(160deg); }

    .hero-tag { display:inline-flex; align-items:center; gap:8px; font-size:.72rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:#efbc98; background:rgba(196,133,90,.14); border:1px solid rgba(196,133,90,.62); border-radius:100px; padding:8px 20px; margin-bottom:40px; animation:fadeUp 1s var(--ease-out-expo) both; }
    .hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--terracotta); animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)} }

    .hero-title { font-family:var(--ff-display); font-size:clamp(2.8rem,7vw,5rem); font-weight:300; letter-spacing:.02em; line-height:1.07; color:rgba(247,242,232,.96); text-shadow:0 6px 18px rgba(0,0,0,.22); max-width:840px; margin-bottom:28px; animation:fadeUp 1.1s .15s var(--ease-out-expo) both; }
    .hero-title em { font-style:italic; color:var(--terracotta-lt); }
    @media(max-width:600px){
      nav { padding:18px 20px; }
      .nav-logo svg { width:160px; }
      .nav-badge { font-size:.62rem; letter-spacing:.12em; padding:6px 12px; }
      .hero-tag { font-size:.66rem; letter-spacing:.18em; padding:7px 16px; }
      .hero-title { font-size:clamp(2.2rem,11vw,3.2rem); line-height:1.12; max-width:330px; }
      .leaf { display:none }
    }
  </style>
</head>
